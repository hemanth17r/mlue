[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlue"
version = "1.6.0"
description = "MLUE: Native AI Computational & Spatial Simulation Substrate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Akkala Hemanth Reddy", email = "hemanth@example.com" }
]
keywords = [
    "ai",
    "autonomous-agents",
    "software-substrate",
    "declarative-ui",
    "state-database",
    "model-context-protocol",
    "mcp",
    "reinforcement-learning",
    "c-abi",
    "deterministic",
    "fixed-point-math",
    "spatial-indexing",
    "simulation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mlue = "mlue:main"
mlue-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/hemanth17r/mlue"
Documentation = "https://github.com/hemanth17r/mlue#readme"
Repository = "https://github.com/hemanth17r/mlue.git"
Tracker = "https://github.com/hemanth17r/mlue/issues"
LiveDashboard = "https://mlue-bench.vercel.app"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "bench*"]
